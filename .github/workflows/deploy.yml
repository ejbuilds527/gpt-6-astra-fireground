name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# REQUIRED for Workload Identity Federation. Without id-token: write the OIDC
# token is never minted and the auth step fails without saying why.
permissions:
  contents: read
  id-token: write

# Deploys to CLOUD RUN, not Firebase Hosting.
#
# next.config.mjs sets output:'standalone', because AuthKit exchanges the auth
# code server-side and seals the session into an encrypted cookie. A static
# export has no server to do either.
#
# And Firebase Hosting forwards exactly ONE cookie to a backend -- `__session`
# -- stripping every other. AuthKit needs two: the session cookie and a PKCE
# cookie. Behind Firebase the callback fails with `missing_pkce_cookie` every
# time. Measured 2026-09-10.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyless. The organisation disables service account key creation, so this
      # is the only path -- there is no key in this repository and none may exist.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/105260816952/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: fireground-deployer@meerkatops-fireground.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # CI builds the image and changes ONLY the image. Terraform owns the rest of the
      # service -- its own runtime account, the three WorkOS secrets, the cap of 3
      # instances and who may call it -- in the infra repo, envs/fireground/chunk7.
      # The service was renamed from astra-fd on 2026-09-13.
      #
      # SECURITY, 2026-09-13: OPENAI_API_KEY and MAPS_API_KEY are not mounted. The live
      # AI routes answer 503 and no Maps key reaches a page. The public showcase at
      # /demo needs neither. See the Fireground security review.
      - name: Build and push the image
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          IMAGE="us-east1-docker.pkg.dev/meerkatops-fireground/fireground/fireground-hackathon:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the image to Cloud Run
        run: |
          gcloud run services update fireground-hackathon \
            --image "$IMAGE" \
            --region us-east1 \
            --project meerkatops-fireground \
            --quiet

      - name: Report the serving URL
        run: |
          gcloud run services describe fireground-hackathon --region us-east1 \
            --project meerkatops-fireground --format='value(status.url)'
